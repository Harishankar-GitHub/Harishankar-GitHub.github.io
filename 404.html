<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Harishankar Bhat Ramachandra</title>
  <meta name="theme-color" content="#0a0d14" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0d14;
      --surface:  #141929;
      --border:   #1e2a42;
      --accent:   #7c6fff;
      --accent-2: #b39dff;
      --text:     #e8edf5;
      --text-muted: #8896b0;
      --font:     'Inter', system-ui, sans-serif;
      --font-mono:'Fira Code', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,111,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      max-width: 520px;
      animation: fade-up 0.6s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -4px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .desc {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.75;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 26px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.25s ease;
      border: 2px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,111,255,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124,111,255,0.45);
      filter: brightness(1.1);
    }
    .btn-outline {
      border-color: var(--border);
      color: var(--text-muted);
      background: var(--surface);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 2px;
      margin: 0 auto 32px;
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="container" role="main">
    <p class="code" aria-label="Error 404">404</p>
    <div class="divider" aria-hidden="true"></div>
    <h1 class="title">Page Not Found</h1>
    <p class="desc">
      Looks like this page doesn't exist or may have been moved.<br>
      Head back to the portfolio or explore from the homepage.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        &#8592; Back to Portfolio
      </a>
      <a href="/#contact" class="btn btn-outline">
        Get in Touch
      </a>
    </div>
  </div>
</body>
</html>
